# Builds release binaries when a version tag (v1.2.3) is pushed.
# See .github/workflows/release.yml. Check locally: goreleaser check
version: 2

project_name: multispeed

before:
  hooks:
    - go mod tidy
    - go test -short ./...
    # Windows version information (product name and version, shown in the file's
    # Properties; required for code signing by SignPath). go-winres writes
    # rsrc_windows_*.syso next to main.go, which `go build` links into Windows
    # builds only. Numeric versions keep snapshot builds (1.2.3-SNAPSHOT-…) valid.
    - >-
      go run github.com/tc-hib/go-winres@v0.3.3 simply
      --arch amd64,arm64
      --product-name multispeed
      --product-version {{ .Major }}.{{ .Minor }}.{{ .Patch }}.0
      --file-version {{ .Major }}.{{ .Minor }}.{{ .Patch }}.0
      --file-description "multispeed: internet speed to many regions"
      --copyright "Copyright (c) 2026 multispeed contributors"
      --original-filename multispeed.exe

builds:
  - id: multispeed
    binary: multispeed
    env:
      - CGO_ENABLED=0
    goos: [windows, linux, darwin]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.buildVersion=v{{ .Version }}

archives:
  # Zip/tar.gz with the README and license.
  - id: archive
    ids: [multispeed]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files: [README.md, LICENSE]
  # The bare program too, so Windows users can download the .exe and double-click it.
  - id: binary
    ids: [multispeed]
    formats: [binary]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:"]

release:
  footer: |
    **Windows:** download `multispeed_windows_amd64.exe` and double-click it. If Windows says
    "Windows protected your PC", see [Windows warning](https://github.com/DarkCowMoo/multispeed#windows-says-windows-protected-your-pc).
    **macOS / Linux:** download the archive for your system, then run `./multispeed` in a terminal.

    [Code signing policy](https://github.com/DarkCowMoo/multispeed#code-signing-policy)
