name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  # main is the default branch, so GitHub suggests it as the base of new pull
  # requests; only dev (a release) may be merged into main.
  pr-base:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Pull requests into main come from dev
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$BASE" = main ] && { [ "$HEAD" != dev ] || [ "$HEAD_REPO" != "$REPO" ]; }; then
            echo "::error::Pull requests go to dev, not main. Edit this pull request and change its base branch to dev."
            exit 1
          fi
          echo "Base $BASE, head $HEAD_REPO:$HEAD: OK"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest

  test:
    strategy:
      fail-fast: false # one OS failing should not hide the others' results
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # Current Go: binaries from old toolchains (e.g. 1.22) no longer start on current macOS.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -o multispeed .

  # Builds every release file exactly as a tag would (GoReleaser, snapshot
  # version), without publishing, so release problems show up before tagging.
  release-dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --snapshot --clean
      - name: Windows binaries carry version information
        run: |
          for exe in $(find dist -name 'multispeed.exe'); do
            # Version resources are UTF-16 strings; strings -el reads those.
            if ! strings -el "$exe" | grep -qx 'ProductName' || ! strings -el "$exe" | grep -qx 'multispeed'; then
              echo "::error::$exe has no version information"; exit 1
            fi
            echo "$exe: $(strings -el "$exe" | grep -A1 -x 'FileVersion' | tail -1)"
          done
      - name: CHANGELOG.md has notes for the version in VERSION
        run: sh scripts/release-notes.sh "$(tr -d '[:space:]' < VERSION)" > /dev/null
      - name: Release scripts pass ShellCheck
        run: shellcheck -S warning scripts/*.sh

  # go.mod sets the minimum Go for "go install"; make sure that still builds and passes.
  min-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go test ./...
